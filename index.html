<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Ociosidad - Auditoría</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .info-block {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        #mensaje {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            display: none;
        }
        .exito { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Auditoría</h2>
    
    <form id="auditoriaForm">
        <!-- Tipo de Registro -->
        <div class="form-group">
            <label for="tipoCarga">Tipo de Carga</label>
            <select id="tipoCarga" onchange="gestionarTipoCarga()">
                <option value="Espacio Real">Espacio Real (Tablet / Manual)</option>
                <option value="Planning">Planning (Programación)</option>
            </select>
        </div>

        <!-- Fecha -->
        <div class="form-group">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
        </div>

        <!-- Bloque de Horario (Se ajusta según el Tipo de Carga) -->
        <div class="form-group">
            <label for="hora">Bloque Horario</label>
            <input type="text" id="hora" readonly>
            <div id="horaInfo" class="info-block">Se calculará automáticamente en bloques de 15 minutos (00, 15, 30, 45).</div>
        </div>

        <!-- Módulo -->
        <div class="form-group">
            <label for="modulo">Módulo</label>
            <select id="modulo" required>
                <option value="">Seleccionar Módulo...</option>
                <option value="Módulo A">Módulo A</option>
                <option value="Módulo B">Módulo B</option>
                <option value="Módulo C">Módulo C</option>
            </select>
        </div>

        <!-- Aula -->
        <div class="form-group">
            <label for="aula">Aula / Espacio</label>
            <input type="text" id="aula" placeholder="Ej: 70, 108, Aula Magna" required>
        </div>

        <!-- Estado -->
        <div class="form-group">
            <label for="estado">Estado</label>
            <select id="estado" required>
                <option value="Libre">Libre</option>
                <option value="Ocupado">Ocupado</option>
            </select>
        </div>

        <button type="submit">Guardar Registro</button>
    </form>

    <div id="mensaje"></div>
</div>

<script>
    // REEMPLAZA ESTA URL CON LA DE TU GOOGLE APPS SCRIPT
    const WEB_APP_URL = "HTTPS://SCRIPT.GOOGLE.COM/MACROS/S/TU_ID_DE_SCRIPT/EXEC";

    // Al cargar la página, inicializamos la fecha y el bloque de 15 minutos
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('fecha').valueAsDate = new Date();
        gestionarTipoCarga();
    });

    // Función para calcular el bloque exacto de 15 minutos según el requerimiento
    function obtenerBloque15Minutos() {
        const ahora = new Date();
        const horas = String(ahora.getHours()).padStart(2, '0');
        const minutosReales = ahora.getMinutes();

        let minutosBloque = '00';

        if (minutosReales >= 0 && minutosReales <= 14) {
            minutosBloque = '00';
        } else if (minutosReales >= 15 && minutosReales <= 29) {
            minutosBloque = '15';
        } else if (minutosReales >= 30 && minutosReales <= 44) {
            minutosBloque = '30';
        } else {
            minutosBloque = '45';
        }

        return `${horas}:${minutosBloque}`;
    }

    // Cambia el comportamiento del campo Hora según si es Espacio Real o Planning
    function gestionarTipoCarga() {
        const tipoCarga = document.getElementById('tipoCarga').value;
        const horaInput = document.getElementById('hora');
        const horaInfo = document.getElementById('horaInfo');

        if (tipoCarga === "Espacio Real") {
            horaInput.value = obtenerBloque15Minutos();
            horaInput.readOnly = true;
            horaInfo.textContent = "Calculado automáticamente a bloques de 15 min (00, 15, 30, 45).";
        } else {
            // En Planning permite la lectura normal o manual sin forzar los 15 min de la tablet
            horaInput.readOnly = false;
            horaInput.placeholder = "Ej: 10:00";
            horaInfo.textContent = "Ingrese la hora correspondiente al Planning.";
        }
    }

    // Actualizar la hora dinámica cada minuto si está en Espacio Real
    setInterval(() => {
        if (document.getElementById('tipoCarga').value === "Espacio Real") {
            document.getElementById('hora').value = obtenerBloque15Minutos();
        }
    }, 60000);

    // Envío de datos a Google Sheets
    document.getElementById('auditoriaForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const mensajeDiv = document.getElementById('mensaje');
        mensajeDiv.style.display = 'none';

        const datos = {
            tipoCarga: document.getElementById('tipoCarga').value,
            fecha: document.getElementById('fecha').value,
            hora: document.getElementById('hora').value,
            modulo: document.getElementById('modulo').value,
            aula: document.getElementById('aula').value,
            estado: document.getElementById('estado').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            mensajeDiv.className = 'exito';
            mensajeDiv.textContent = '¡Registro guardado correctamente!';
            mensajeDiv.style.display = 'block';

            // Resetear solo los campos de aula y estado para agilizar la carga consecutiva
            document.getElementById('aula').value = '';
            document.getElementById('estado').value = 'Libre';
            
            // Recalcular la hora por si cambió el minuto
            gestionarTipoCarga();
        })
        .catch(error => {
            mensajeDiv.className = 'error';
            mensajeDiv.textContent = 'Ocurrió un error al guardar los datos.';
            mensajeDiv.style.display = 'block';
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
