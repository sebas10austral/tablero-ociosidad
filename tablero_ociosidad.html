<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Ociosidad - Universidad Austral</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header Principal -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-lg text-white">
                    <i class="fa-solid fa-chart-pie text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Universidad Austral - Operaciones</h1>
                    <p class="text-xs text-slate-400">Control de Ociosidad de Aulas (Sincronizado con Google Drive)</p>
                </div>
            </div>
            <div class="mt-3 sm:mt-0 flex space-x-2">
                <span id="syncStatus" class="bg-emerald-900/60 text-emerald-300 border border-emerald-700 text-xs px-3 py-1.5 rounded-lg flex items-center font-medium">
                    <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i> Conectado a la Nube
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- Tarjetas de KPIs (Indicadores) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Auditorías</p>
                    <h3 id="kpi-total" class="text-3xl font-bold text-slate-900 mt-1">0</h3>
                </div>
                <div class="bg-blue-50 text-blue-600 p-3 rounded-full"><i class="fa-solid fa-clipboard-list text-xl"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-rose-600">Aulas Ociosas</p>
                    <h3 id="kpi-ociosas" class="text-3xl font-bold text-rose-600 mt-1">0</h3>
                </div>
                <div class="bg-rose-50 text-rose-600 p-3 rounded-full"><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-emerald-600">Uso Conforme / OK</p>
                    <h3 id="kpi-ok" class="text-3xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-3 rounded-full"><i class="fa-solid fa-circle-check text-xl"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-indigo-600">% Tasa Ociosidad</p>
                    <h3 id="kpi-tasa" class="text-3xl font-bold text-indigo-600 mt-1">0%</h3>
                </div>
                <div class="bg-indigo-50 text-indigo-600 p-3 rounded-full"><i class="fa-solid fa-percent text-xl"></i></div>
            </div>
        </div>

        <!-- Formulario y Tabla -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Formulario de Registro -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-900 flex items-center">
                    <i class="fa-solid fa-pen-to-square text-indigo-600 mr-2"></i> Registrar Auditoría
                </h2>
                <form id="auditForm" onsubmit="guardarAuditoria(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Fecha</label>
                        <input type="date" id="inputFecha" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Turno</label>
                        <select id="inputTurno" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option>1. Mañana</option>
                            <option>2. Tarde</option>
                            <option>3. Noche</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Módulo</label>
                        <select id="inputModulo" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option>Módulo A</option>
                            <option>Módulo B</option>
                            <option>Módulo C</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Aula / Espacio</label>
                        <input type="text" id="inputAula" placeholder="Ej: A3, B1.1, 65" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Espacio Real</label>
                            <select id="inputReal" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="Ocupado">Ocupado</option>
                                <option value="Libre">Libre</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Planning (Sistema)</label>
                            <select id="inputPlanning" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="Ocupado">Ocupado</option>
                                <option value="Libre">Libre</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="btnGuardar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow flex items-center justify-center">
                        <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Guardar en Google Drive
                    </button>
                </form>
            </div>

            <!-- Tabla de Registros -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4 flex flex-col">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center">
                        <i class="fa-solid fa-table-cells text-indigo-600 mr-2"></i> Historial Reciente
                    </h2>
                    <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="Buscar aula o módulo..." class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-64">
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left text-sm" id="tablaAuditoria">
                        <thead class="bg-slate-100 text-slate-600 uppercase text-xs">
                            <tr>
                                <th class="p-3">Fecha / Turno</th>
                                <th class="p-3">Módulo</th>
                                <th class="p-3">Aula</th>
                                <th class="p-3">Real</th>
                                <th class="p-3">Planning</th>
                                <th class="p-3 text-center">Estado</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200" id="tablaCuerpo">
                            <!-- Inyectado por JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script>
        let registros = [];
        document.getElementById('inputFecha').valueAsDate = new Date();

        async function guardarAuditoria(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando en la nube...';

            const real = document.getElementById('inputReal').value;
            const planning = document.getElementById('inputPlanning').value;
            const estado = (real === 'Libre' && planning === 'Ocupado') ? 'OCIOSA' : 'OK';

            const nuevoRegistro = {
                fecha: document.getElementById('inputFecha').value,
                turno: document.getElementById('inputTurno').value,
                modulo: document.getElementById('inputModulo').value,
                aula: document.getElementById('inputAula').value.toUpperCase(),
                real: real,
                planning: planning,
                estado: estado
            };

            try {
                // PEGA AQUÍ ABAJO TU URL DE GOOGLE APPS SCRIPT ENTRE LAS COMILLAS
                const URL_GOOGLE_SHEET = "https://script.google.com/macros/s/AKfycbw6v33DYPhuUpQ5iW8v774mUtVGOYHcVjZudBc_v19iWc5sfIFXBKTmMy1inziIDUwM/exec";

                await fetch(URL_GOOGLE_SHEET, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoRegistro)
                });

                // Agregar a la lista local y actualizar tablero
                registros.unshift(nuevoRegistro);
                document.getElementById('inputAula').value = '';
                actualizarTablero();
                alert("¡Registro guardado con éxito en Google Drive!");

            } catch (error) {
                console.error("Error:", error);
                alert("Hubo un error al conectar con Google Drive.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-2"></i> Guardar en Google Drive';
            }
        }

        function actualizarTablero() {
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            let total = registros.length;
            let ociosas = 0;
            let ok = 0;

            registros.forEach((reg) => {
                let esOciosa = (reg.estado === 'OCIOSA');
                if (esOciosa) ociosas++; else ok++;

                let tr = document.createElement('tr');
                tr.className = esOciosa ? 'bg-rose-50/50 hover:bg-rose-50' : 'hover:bg-slate-50';
                
                tr.innerHTML = `
                    <td class="p-3 font-medium">${reg.fecha}<br><span class="text-xs text-slate-500">${reg.turno}</span></td>
                    <td class="p-3">${reg.modulo}</td>
                    <td class="p-3 font-bold text-indigo-900">${reg.aula}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-semibold ${reg.real === 'Ocupado' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${reg.real}</span></td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-semibold ${reg.planning === 'Ocupado' ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-200 text-slate-700'}">${reg.planning}</span></td>
                    <td class="p-3 text-center">
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold ${esOciosa ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}">
                            ${reg.estado}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('kpi-total').innerText = total;
            document.getElementById('kpi-ociosas').innerText = ociosas;
            document.getElementById('kpi-ok').innerText = ok;
            document.getElementById('kpi-tasa').innerText = total > 0 ? ((ociosas / total) * 100).toFixed(1) + '%' : '0%';
        }

        function filtrarTabla() {
            let filtro = document.getElementById('buscador').value.toLowerCase();
            let filas = document.getElementById('tablaCuerpo').getElementsByTagName('tr');
            for (let fila of filas) {
                let texto = fila.innerText.toLowerCase();
                fila.style.display = texto.includes(filtro) ? '' : 'none';
            }
        }
    </script>
</body>
</html>
