<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Ociosidad - Universidad Austral</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header Principal -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white">
                        <i class="fa-solid fa-chart-pie text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-base sm:text-lg font-bold tracking-tight">Universidad Austral</h1>
                        <p class="text-[10px] sm:text-xs text-slate-400">Control de Ociosidad de Aulas</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                <span id="syncStatus" class="bg-emerald-900/60 text-emerald-300 border border-emerald-700 text-xs px-2.5 py-1 rounded-lg flex items-center font-medium">
                    <i class="fa-solid fa-cloud-check mr-1.5"></i> Conectado a la Nube
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Tarjetas de KPIs -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500">Total</p>
                    <h3 id="kpi-total" class="text-2xl sm:text-3xl font-bold text-slate-900 mt-0.5">0</h3>
                </div>
                <div class="bg-blue-50 text-blue-600 p-2.5 rounded-full"><i class="fa-solid fa-clipboard-list text-lg"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-rose-600">Ociosas</p>
                    <h3 id="kpi-ociosas" class="text-2xl sm:text-3xl font-bold text-rose-600 mt-0.5">0</h3>
                </div>
                <div class="bg-rose-50 text-rose-600 p-2.5 rounded-full"><i class="fa-solid fa-triangle-exclamation text-lg"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-emerald-600">Uso OK</p>
                    <h3 id="kpi-ok" class="text-2xl sm:text-3xl font-bold text-emerald-600 mt-0.5">0</h3>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-2.5 rounded-full"><i class="fa-solid fa-circle-check text-lg"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-indigo-600">% Ociosidad</p>
                    <h3 id="kpi-tasa" class="text-2xl sm:text-3xl font-bold text-indigo-600 mt-0.5">0%</h3>
                </div>
                <div class="bg-indigo-50 text-indigo-600 p-2.5 rounded-full"><i class="fa-solid fa-percent text-lg"></i></div>
            </div>
        </div>

        <!-- Formulario y Tabla -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Formulario de Registro -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-base font-bold text-slate-900 flex items-center">
                    <i class="fa-solid fa-pen-to-square text-indigo-600 mr-2"></i> Registrar Auditoría
                </h2>
                <form id="auditForm" onsubmit="guardarAuditoria(event)" class="space-y-3.5">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Fecha</label>
                        <input type="date" id="inputFecha" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Edificio / Módulo</label>
                        <select id="inputModulo" onchange="cambiarModulo()" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Módulo A">Módulo A</option>
                            <option value="Módulo B">Módulo B</option>
                            <option value="Módulo C">Módulo C</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Aula / Espacio</label>
                        <select id="inputAula" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                            <!-- Se carga dinámicamente -->
                        </select>
                    </div>
                    <div id="contenedorEstados" class="grid grid-cols-2 gap-3">
                        <div id="colReal" class="col-span-1">
                            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Estado Real</label>
                            <select id="inputReal" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="Ocupado">Ocupado</option>
                                <option value="Libre">Libre</option>
                            </select>
                        </div>
                        <div id="colPlanning" class="col-span-1">
                            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Planning</label>
                            <select id="inputPlanning" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option value="Ocupado">Ocupado</option>
                                <option value="Libre">Libre</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="btnGuardar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow flex items-center justify-center text-sm">
                        <i class="fa-solid fa-paper-plane mr-2"></i> Enviar Registro
                    </button>
                </form>
            </div>

            <!-- Tabla de Registros -->
            <div class="lg:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4 flex flex-col">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                    <h2 class="text-base font-bold text-slate-900 flex items-center w-full sm:w-auto">
                        <i class="fa-solid fa-list-check text-indigo-600 mr-2"></i> Mis Registros Recientes
                    </h2>
                    <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="Buscar aula o módulo..." class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-48">
                </div>
                <div class="overflow-x-auto flex-1 border border-slate-100 rounded-lg">
                    <table class="w-full text-left text-sm" id="tablaAuditoria">
                        <thead class="bg-slate-100 text-slate-600 uppercase text-xs">
                            <tr>
                                <th class="p-2.5">Fecha / Hora</th>
                                <th class="p-2.5">Módulo</th>
                                <th class="p-2.5">Aula / Oficina</th>
                                <th class="p-2.5">Real</th>
                                <th class="p-2.5">Planning</th>
                                <th class="p-2.5 text-center">Estado</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200" id="tablaCuerpo">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT TERMINADA EN /exec
        const URL_GOOGLE_SHEET = "https://script.google.com/macros/s/AKfycbzQ2YMgDYo3xOPaKANJEc0yXheSihNF3nCefCC2iWY/exec";

        const listaAulas = {
            "Módulo A": ["A1", "A2", "A3", "A4", "A5", "A6", "A7", "A8", "A9", "A10", "A11", "Auditorio"],
            "Módulo B": ["B1.1", "B1.2", "B2", "B3", "B4", "B5", "B6", "B7", "B8.1", "B8.2", "B9", "B10", "B11.1", "B11.2", "B12", "B13", "B14", "B15", "B16", "B17"],
            "Módulo C": ["50", "51", "52", "53", "54", "55", "57", "58", "65", "66", "67", "68", "69", "70", "71", "72", "73", "74", "75", "79", "80", "81", "82", "83", "84", "85", "86", "87", "97", "98", "99", "100", "101", "102", "103", "104", "105", "106", "107", "108", "109", "110", "111", "Olivo C"]
        };

        let registros = JSON.parse(localStorage.getItem('auditorias_sesion')) || [];
        document.getElementById('inputFecha').valueAsDate = new Date();

        document.addEventListener('DOMContentLoaded', () => {
            cambiarModulo();
            actualizarTablero();
        });

        function cambiarModulo() {
            const moduloSelect = document.getElementById('inputModulo').value;
            const aulaSelect = document.getElementById('inputAula');
            const colPlanning = document.getElementById('colPlanning');
            const colReal = document.getElementById('colReal');
            
            // Cargar aulas/oficinas correspondientes
            aulaSelect.innerHTML = '';
            const aulasDelModulo = listaAulas[moduloSelect] || [];
            aulasDelModulo.forEach(aula => {
                let option = document.createElement('option');
                option.value = aula;
                option.text = aula;
                aulaSelect.appendChild(option);
            });

            // Si es Módulo C -> ocultar la columna de Planning y expandir la de Real
            if (moduloSelect === "Módulo C") {
                colPlanning.style.display = 'none';
                colReal.classList.remove('col-span-1');
                colReal.classList.add('col-span-2');
            } else {
                colPlanning.style.display = 'block';
                colReal.classList.remove('col-span-2');
                colReal.classList.add('col-span-1');
            }
        }

        async function guardarAuditoria(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Enviando...';

            const modulo = document.getElementById('inputModulo').value;
            const real = document.getElementById('inputReal').value;
            
            let planning = "-";
            let estado = "OK";

            if (modulo === "Módulo C") {
                planning = "N/A";
                estado = (real === "Libre") ? "OCIOSA" : "OK";
            } else {
                planning = document.getElementById('inputPlanning').value;
                estado = (real === 'Libre' && planning === 'Ocupado') ? 'OCIOSA' : 'OK';
            }

            const ahora = new Date();
            const horaActual = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

            const nuevoRegistro = {
                fecha: document.getElementById('inputFecha').value,
                hora: horaActual,
                modulo: modulo,
                aula: document.getElementById('inputAula').value,
                real: real,
                planning: planning,
                estado: estado
            };

            try {
                await fetch(URL_GOOGLE_SHEET, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoRegistro)
                });

                registros.unshift(nuevoRegistro);
                localStorage.setItem('auditorias_sesion', JSON.stringify(registros));
                
                actualizarTablero();
                alert("¡Registro enviado con éxito!");

            } catch (error) {
                console.error("Error:", error);
                alert("Error de conexión. Revisa tu acceso a internet.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Enviar Registro';
            }
        }

        function actualizarTablero() {
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            let total = registros.length;
            let ociosas = 0;
            let ok = 0;

            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">No has registrado auditorías en esta sesión.</td></tr>`;
            } else {
                registros.forEach((reg) => {
                    let esOciosa = (reg.estado === 'OCIOSA');
                    if (esOciosa) ociosas++; else ok++;

                    let tr = document.createElement('tr');
                    tr.className = esOciosa ? 'bg-rose-50/50 hover:bg-rose-50' : 'hover:bg-slate-50';
                    
                    tr.innerHTML = `
                        <td class="p-2.5 font-medium">
                            ${reg.fecha}
                            <br><span class="text-[10px] text-slate-500"><i class="fa-regular fa-clock mr-1"></i>${reg.hora || '--:--'}</span>
                        </td>
                        <td class="p-2.5">${reg.modulo}</td>
                        <td class="p-2.5 font-bold text-indigo-900">${reg.aula}</td>
                        <td class="p-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${reg.real === 'Ocupado' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${reg.real}</span></td>
                        <td class="p-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-semibold ${reg.planning === 'Ocupado' ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-200 text-slate-700'}">${reg.planning}</span></td>
                        <td class="p-2.5 text-center">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${esOciosa ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}">
                                ${reg.estado}
                            </span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('kpi-total').innerText = total;
            document.getElementById('kpi-ociosas').innerText = ociosas;
            document.getElementById('kpi-ok').innerText = ok;
            document.getElementById('kpi-tasa').innerText = total > 0 ? ((ociosas / total) * 100).toFixed(1) + '%' : '0%';
        }

        function filtrarTabla() {
            let filtro = document.getElementById('buscador').value.toLowerCase();
            let filas = document.getElementById('tablaCuerpo').getElementsByTagName('tr');
            for (let fila of filas) {
                let texto = fila.innerText.toLowerCase();
                fila.style.display = texto.includes(filtro) ? '' : 'none';
            }
        }
    </script>
</body>
</html>
